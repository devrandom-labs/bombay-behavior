name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semver:
    name: Published API Change Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix for the API audit tool
        uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Install the stack-safe published API audit tool
        run: |
          nix develop -c bash --noprofile --norc -euo pipefail <<'BASH'
          : "${RUNNER_TEMP:?}" "${GITHUB_WORKSPACE:?}" "${GITHUB_PATH:?}"
          audit_root="$(mktemp -d "$RUNNER_TEMP/semver-checks-stack-safe-json.XXXXXX")"
          curl --fail --show-error --location \
            https://static.crates.io/crates/cargo-semver-checks/cargo-semver-checks-0.51.0.crate \
            --output "$audit_root/cargo-semver-checks.crate"
          curl --fail --show-error --location \
            https://static.crates.io/crates/trustfall_rustdoc/trustfall_rustdoc-0.41.0.crate \
            --output "$audit_root/trustfall_rustdoc.crate"
          printf '%s  %s\n' \
            484e65e62077aed1a119d04ab414038d20b9013302b7353487ff69a461842bf8 \
            "$audit_root/cargo-semver-checks.crate" \
            4e8e5bc5ca93f6c30f148911c07229c704144de5920cc06851e57a8214372804 \
            "$audit_root/trustfall_rustdoc.crate" | sha256sum --check --strict
          tar --extract --gzip --file "$audit_root/cargo-semver-checks.crate" --directory "$audit_root"
          tar --extract --gzip --file "$audit_root/trustfall_rustdoc.crate" --directory "$audit_root"
          checker_source="$audit_root/cargo-semver-checks-0.51.0"
          rustdoc_source="$audit_root/trustfall_rustdoc-0.41.0"
          patch --batch --forward --fuzz=0 --strip=1 --directory "$rustdoc_source" \
            < "$GITHUB_WORKSPACE/.github/semver-checks-stack-safe-json.patch"
          printf '\n[patch.crates-io]\ntrustfall_rustdoc = { path = "../trustfall_rustdoc-0.41.0" }\n' \
            >> "$checker_source/Cargo.toml"
          cp "$GITHUB_WORKSPACE/.github/semver-checks-stack-safe-json.Cargo.lock" "$checker_source/Cargo.lock"
          cargo build --locked --release --bin cargo-semver-checks \
            --manifest-path "$checker_source/Cargo.toml" --target-dir "$audit_root/target"
          mkdir "$audit_root/bin"
          cp "$audit_root/target/release/cargo-semver-checks" "$audit_root/bin/cargo-semver-checks"
          "$audit_root/bin/cargo-semver-checks" --version
          printf '%s\n' "$audit_root/bin" >> "$GITHUB_PATH"
          BASH

      - name: Compare published APIs
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: bombay-behavior, bombay-behavior-actors
          # Ordinary PRs must preserve the published API. A deliberately
          # breaking batch is explicit in review, while main must admit that
          # batch long enough for release-plz to create its version-bump PR.
          release-type: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'semver-breaking') && 'minor' || 'major' }}
          rust-toolchain: 1.95.0

  checks:
    name: Nix Flake Check
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            keep-env-derivations = true
            keep-outputs = true

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'flake.nix', 'flake.lock', 'Cargo.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 1G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      - name: Flake Check
        run: nix flake check -L

      - name: Verify external interpreter dependency graph
        run: nix develop -c python3 scripts/check_interpreter_contract_graph.py

      - name: External interpreter contract, debug
        run: nix develop -c cargo test --locked --manifest-path tests/interpreter-contract/Cargo.toml

      - name: External interpreter contract, optimized
        run: nix develop -c cargo test --locked --release --manifest-path tests/interpreter-contract/Cargo.toml

      - name: Build fuzz targets
        run: nix run .#fuzz -- build

  # The single-run Mutation Gate was ceiling-cancelled at GitHub's default
  # 6h job limit (run 35260993642) with no verdict, so the campaign now runs
  # as eight parallel shards. Every shard shares the same campaign arguments
  # and the same denominator (see mkMutantsShard in flake.nix); each uploads
  # its outcomes and the discovered-candidate list. The aggregate job named
  # `Mutation Gate` is the single authoritative verdict: the gate passes only
  # when every shard report is collected and the strict gate accepts the
  # merged full-campaign results.
  mutation-shards:
    name: Mutation Gate (shard ${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    timeout-minutes: 270
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            keep-env-derivations = true
            keep-outputs = true

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: mutation-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'flake.nix', 'flake.lock', 'Cargo.lock', 'mutants-baseline.json') }}
          restore-prefixes-first-match: mutation-${{ runner.os }}-
          gc-max-store-size-linux: 2G
          purge: true
          purge-prefixes: mutation-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      - name: Run mutation shard
        run: nix build .#mutants-shard${{ matrix.shard }} -L

      - name: Collect shard report
        run: |
          report_dir="$(find -L result -type f -name outcomes.json -printf '%h\n' | head -n1)"
          if [ -z "$report_dir" ]; then
            echo "no outcomes.json found under result/"
            exit 1
          fi
          mkdir -p "shard-report-${{ matrix.shard }}"
          cp "$report_dir/outcomes.json" "$report_dir/mutants.json" "shard-report-${{ matrix.shard }}/"
          cp -R "$report_dir/log" "shard-report-${{ matrix.shard }}/"
          if [ -d "$report_dir/diff" ]; then
            cp -R "$report_dir/diff" "shard-report-${{ matrix.shard }}/"
          else
            jq -e 'all(.outcomes[]; .diff_path == null)' "$report_dir/outcomes.json"
          fi

      - name: Upload shard report
        uses: actions/upload-artifact@v4
        with:
          name: mutation-shard-${{ matrix.shard }}
          path: shard-report-${{ matrix.shard }}/
          if-no-files-found: error

  mutation-aggregate:
    name: Mutation Gate
    needs: mutation-shards
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Require every mutation shard to pass
        run: |
          result='${{ needs.mutation-shards.result }}'
          echo "mutation-shards result: $result"
          if [ "$result" != "success" ]; then
            echo "One or more mutation shards failed, were cancelled, or were skipped."
            exit 1
          fi

      - name: Download all shard reports
        uses: actions/download-artifact@v4
        with:
          pattern: mutation-shard-*
          path: shards

      - name: Assert every shard report is collected
        run: |
          found="$(find shards -maxdepth 1 -mindepth 1 -type d | wc -l)"
          echo "collected $found shard report(s)"
          if [ "$found" -ne 8 ]; then
            echo "expected 8 shard reports (one per partition)"
            exit 1
          fi
          for directory in shards/mutation-shard-*/; do
            for file in outcomes.json mutants.json; do
              if [ ! -s "$directory$file" ]; then
                echo "missing or empty $file in $directory"
                exit 1
              fi
            done
          done

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            keep-env-derivations = true
            keep-outputs = true

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: mutation-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'flake.nix', 'flake.lock', 'Cargo.lock', 'mutants-baseline.json') }}
          restore-prefixes-first-match: mutation-${{ runner.os }}-
          gc-max-store-size-linux: 2G
          purge: true
          purge-prefixes: mutation-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      - name: Build the gate binary
        run: nix build .#default -L

      - name: Merge shard reports into one campaign
        shell: bash
        run: |
          mkdir -p merged
          for shard in 0 1 2 3 4 5 6 7; do
            shard_report="shards/mutation-shard-$shard"
            jq -e '[.outcomes[] | select(.scenario == "Baseline")] |
              length == 1 and .[0].summary == "Success"' "$shard_report/outcomes.json"
            cp -R "$shard_report" "merged/mutation-shard-$shard"
            jq --arg shard "mutation-shard-$shard" '
              .outcomes |= map(
                reduce ["log_path", "diff_path"][] as $artifact (.;
                  if .[$artifact] == null then .
                  elif (.[$artifact] | type) != "string" or
                       (.[$artifact] | startswith("/") or startswith("./") or
                        . == "." or (split("/") | index("..") != null)) then
                    error("invalid original shard artifact path")
                  else .[$artifact] = ($shard + "/" + .[$artifact])
                  end
                )
              )' "$shard_report/outcomes.json" > "merged/mutation-shard-$shard/rebased-outcomes.json"
          done
          jq -e -s 'map(.outcomes[] | select(.scenario == "Baseline") |
            {scenario, summary, phase_results:
              [.phase_results[] | {phase, process_status, argv}]}) |
            unique | length == 1' shards/mutation-shard-*/outcomes.json
          # All eight baseline facts remain in the original shard reports.
          # Select one campaign baseline only after every shard baseline passed.
          jq -s '{outcomes:
            ([.[0].outcomes[] | select(.scenario == "Baseline")] +
             [.[].outcomes[] | select(.scenario != "Baseline")])
          }' merged/mutation-shard-*/rebased-outcomes.json > merged/outcomes.json
          jq -s 'add' shards/mutation-shard-*/mutants.json > merged/mutants.json

      - name: Strict mutation verdict over the merged campaign
        shell: bash
        run: |
          ./result/bin/behavior-mutants-gate check merged mutants-baseline.json \
            | tee merged-mutation-gate-report.txt
