name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semver:
    name: Published API Change Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare published APIs
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: bombay-behavior, bombay-behavior-actors
          # Ordinary PRs must preserve the published API. A deliberately
          # breaking batch is explicit in review, while main must admit that
          # batch long enough for release-plz to create its version-bump PR.
          release-type: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'semver-breaking') && 'minor' || 'major' }}
          rust-toolchain: 1.95.0

  checks:
    name: Nix Flake Check
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            keep-env-derivations = true
            keep-outputs = true

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'flake.nix', 'flake.lock', 'Cargo.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 1G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      - name: Flake Check
        run: nix flake check -L

      - name: Build fuzz targets
        run: nix run .#fuzz -- build

  mutation:
    name: Mutation Gate
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            keep-env-derivations = true
            keep-outputs = true

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: mutation-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'flake.nix', 'flake.lock', 'Cargo.lock', 'mutants-baseline.json') }}
          restore-prefixes-first-match: mutation-${{ runner.os }}-
          gc-max-store-size-linux: 2G
          purge: true
          purge-prefixes: mutation-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      - name: Run strict mutation verdict
        run: nix build .#mutants -L
