name: Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
      - name: Install mdBook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.4.52
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc -p bombay-behavior -p bombay-behavior-actors --no-deps
          mdbook build docs
      - name: Add landing page
        run: cp .github/pages-index.html target/doc/index.html
      - name: Verify published documentation
        run: |
          python3 -m unittest scripts/test_check_published_docs.py
          test -f target/doc/index.html
          test -f target/doc/guide/index.html
          test -f target/doc/behavior/index.html
          test -f target/doc/behavior_actors/index.html
          python3 scripts/check_published_docs.py target/doc
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
