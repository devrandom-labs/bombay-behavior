# behaviorpass — the Behavior-algebra concision harness (bombay card #298).
#
# The pillar-pass sibling of fastpass/locationpass. Where fastpass golfs a
# two-lane merge for THROUGHPUT, behaviorpass golfs bombay's capability
# machinery for CONCISION (LOC), gated on trace-equality to a frozen
# essence-fold reference (ADR-0028/0030). Findings return to bombay as CARDS,
# never direct commits.
[workspace]
resolver = "3"
members = [
  "crates/behaviorpass",
]

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/devrandom-labs/behaviorpass"

[workspace.dependencies]
thiserror = "2.0"
tokio = { version = "1.47", default-features = false }
# fastpass — the sibling pillar-pass mailbox (user + control lanes); the SUT
# consumes it so behaviorpass golfs CAPABILITY LOC, not mailbox plumbing.
fastpass = { path = "../fastpass/crates/fastpass" }
behaviorpass = { path = "crates/behaviorpass" }

# Keep the research crates lint-honest without importing bombay's full god-tier
# config — this is a spike, but the invariants are real. The concision loop's
# checks.sh additionally runs bombay's restriction suite as the LOC regularizer
# (a line bought with unreadability is reverted).
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
