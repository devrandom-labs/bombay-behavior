[workspace]
resolver = "2"
members = [
    "crates/behavior",
    "crates/behavior-macros",
    "crates/behavior-testkit",
]

[workspace.package]
version = "0.8.1"
edition = "2024"
rust-version = "1.95.0"
license = "MIT OR Apache-2.0"
authors = ["Joel DSouza <joel@devrandom.co>"]
repository = "https://github.com/devrandom-labs/bombay-behavior"
homepage = "https://devrandom-labs.github.io/bombay-behavior/"

[workspace.dependencies]
behavior = { package = "bombay-behavior", path = "crates/behavior" }
behavior-macros = { package = "bombay-behavior-macros", version = "0.8.1", path = "crates/behavior-macros" }
behavior-testkit = { package = "bombay-behavior-testkit", path = "crates/behavior-testkit" }
communication = { package = "bombay-communication", version = "0.1.0" }
criterion = "0.8"
proptest = "1.11"
thiserror = "2.0"
tokio = { version = "1.47", default-features = false }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[workspace.metadata.crane]
name = "bombay-behavior"
