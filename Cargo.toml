[workspace]
resolver = "2"
members = [
    "crates/behavior",
    "crates/actors",
    "crates/behavior-macros",
    "crates/behavior-testkit",
    "crates/mutants-gate",
]

[workspace.package]
version = "0.14.0"
edition = "2024"
rust-version = "1.95.0"
license = "MIT OR Apache-2.0"
authors = ["Joel DSouza <joel@devrandom.co>"]
repository = "https://github.com/devrandom-labs/bombay-behavior"
homepage = "https://devrandom-labs.github.io/bombay-behavior/"

[workspace.dependencies]
actors = { package = "bombay-behavior-actors", version = "0.14.0", path = "crates/actors" }
behavior = { package = "bombay-behavior", version = "0.14.0", path = "crates/behavior" }
behavior-macros = { package = "bombay-behavior-macros", version = "0.11.4", path = "crates/behavior-macros" }
behavior-testkit = { package = "bombay-behavior-testkit", path = "crates/behavior-testkit" }
criterion = "0.8"
proptest = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = { version = "2.0", default-features = false }
tokio = { version = "1.47", default-features = false }

[workspace.lints.clippy]
# Correctness and suspicious constructs are hard failures. Broad style,
# complexity, and performance groups are not compiler gates: elevating them
# rewards the exact aliases, wrappers, boxing, and branch reshaping that this
# crate must review semantically instead of accepting mechanically.
all = { level = "allow", priority = -2 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
pedantic = { level = "allow", priority = -1 }
# Static actor products are intentionally concrete. Denying this lint rewards
# aliases and wrapper types that merely hide the real protocol algebra.
type_complexity = "allow"
# Interpreter traits state `impl Future + Send` explicitly. Rewriting their
# implementations as `async fn` hides the Send obligation the boundary owns.
manual_async_fn = "allow"
allow_attributes_without_reason = "deny"
debug_assert_with_mut_call = "deny"
let_underscore_must_use = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.metadata.crane]
name = "bombay-behavior"
