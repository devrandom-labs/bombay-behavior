# behaviorpass — the behavior algebra: the pure fold at the heart of the
# pass family. A Behavior folds an Envelope into Actions (sends, creates,
# become — all DATA, no I/O); every capability is a Behavior wrapping a
# Behavior; the floor is a State coalgebra. Correctness gate: trace-equality
# to the frozen reference at every lattice point (tests/oracle.rs). Perf
# ruler: the space/throughput fitness of the Supervising children mechanism
# (.auto/, examples/perf_supervising.rs) — representation optimization
# BEHIND a stable API, never a deformation of it. Findings return to bombay
# as CARDS, never direct commits.
[workspace]
resolver = "3"
members = [
  "crates/behaviorpass", "crates/behaviorpass-macros",
]

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/devrandom-labs/behaviorpass"

[workspace.dependencies]
thiserror = "2.0"
tokio = { version = "1.47", default-features = false }
# fastpass — the sibling pillar-pass mailbox (user + control lanes); the
# algebra's drivers consume it, so the crates measure CAPABILITY machinery,
# not mailbox plumbing.
fastpass = { path = "../fastpass/crates/fastpass" }
behaviorpass = { path = "crates/behaviorpass" }

# Keep the research crates lint-honest without importing bombay's full god-tier
# config — this is a spike, but the invariants are real. The lints table is the
# law: clean APIs are enforced by lints, never by line counts.
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
