[package]
name = "bombay-behavior-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[lints.rust]
unused_must_use = "deny"

[package.metadata]
cargo-fuzz = true

[dependencies]
behavior-actors = { package = "bombay-behavior-actors", path = "../../../crates/actors" }
behavior-core = { package = "bombay-behavior", path = "../../../crates/behavior" }
libfuzzer-sys = "0.4"
tokio = { version = "1.47", features = ["rt", "time"] }

