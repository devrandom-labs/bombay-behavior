[package]
name = "behaviorpass"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The golf target: bombay's capability machinery + the 24-point lattice generator (bombay card #298)."

# The behavior algebra: the pure fold (Behavior/State/Actions/Envelope) and
# the capability stack over it. The trace oracle (tests/oracle.rs) is the
# correctness gate; the perf loop (.auto/) optimizes REPRESENTATIONS behind
# this crate's stable public API.
[dependencies]
behaviorpass-macros = { version = "0.1.0", path = "../behaviorpass-macros" }

fastpass = { workspace = true }                 # the mailbox (user + control lanes)
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "macros", "rt"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time", "sync", "test-util"] }
proptest = "1.11"

[lints]
workspace = true
