[package]
name = "behaviorpass"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The golf target: bombay's capability machinery + the 24-point lattice generator (bombay card #298)."

# The behavior algebra: receive an associated event protocol and produce only
# typed sends, fresh creates, and become. Capability wrappers derive larger
# protocols without runtime queries or erased messages.
[dependencies]
behaviorpass-macros = { version = "0.1.0", path = "../behaviorpass-macros" }

fastpass = { workspace = true }                 # the mailbox (user + control lanes)
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "macros", "rt"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time", "sync", "test-util"] }
proptest = "1.11"

[lints]
workspace = true
